<div class="doc-panel">
    <div class="doc-panel-head">
        <div class="doc-panel-title"><i class="ti ti-folders"></i><span class="doc-panel-text">文档分类</span></div>
        <div class="doc-panel-actions">
            <button type="button" class="doc-panel-collapse d-none d-md-inline-flex" data-sidebar-collapse aria-expanded="true" aria-label="折叠分类栏" title="折叠分类栏">
                <i class="ti ti-layout-navbar nm-ic-collapse"></i><i class="ti ti-chevron-right nm-ic-expand"></i>
            </button>
            <button type="button" class="doc-panel-close d-md-none" data-sidebar-close aria-label="关闭分类面板">
                <i class="ti ti-x"></i>
            </button>
        </div>
    </div>
    <nav class="doc-cat-nav">
        <a class="cat-all{if $allActive} active{/if}" href="/docs" title="全部文档">
            <i class="ti ti-layout-list"></i><span class="doc-panel-text">全部文档</span>
        </a>
        {if $uncategorizedDocs}
        <ul class="cat-doc-list cat-doc-list-root">
            {foreach $uncategorizedDocs as $item}
            <li class="cat-doc-item">
                <a class="cat-doc-link{if $activeDocId == $item.id} active{/if}" href="/doc/{$item.id}.html"{if $activeDocId == $item.id} aria-current="page"{/if} title="{$item.title}">
                    <i class="ti ti-file-text"></i><span>{$item.title}</span>
                    {if $item.is_encrypted}<i class="ti ti-lock cat-lock" title="加密文档"></i>{/if}
                </a>
            </li>
            {/foreach}
        </ul>
        {/if}
        {if $catTreeHtml}
        <div class="cat-tree-wrap">{$catTreeHtml|raw}</div>
        {else}
        <div class="doc-cat-empty doc-panel-text">暂无公开分类</div>
        {/if}
    </nav>
    <div class="doc-panel-foot">
        <i class="ti ti-lock"></i><span class="doc-panel-text">{$docSidebarNote}</span>
    </div>
</div>
