<div class="doc-panel">
    <div class="doc-panel-head">
        <div class="doc-panel-title"><i class="ti ti-folders"></i>文档分类</div>
        <button type="button" class="doc-panel-close d-md-none" data-sidebar-close aria-label="关闭分类面板">
            <i class="ti ti-x"></i>
        </button>
    </div>
    <button type="button" class="doc-panel-search" data-search-open aria-label="搜索公开文档（Ctrl+K）">
        <i class="ti ti-search"></i>
        <span>搜索文档...</span>
        <kbd>Ctrl K</kbd>
    </button>
    <nav class="doc-cat-nav">
        <a class="cat-all{if $allActive} active{/if}" href="/docs">
            <i class="ti ti-layout-list"></i><span>全部文档</span>
        </a>
        {if $catTreeHtml}
        <div class="cat-tree-wrap">{$catTreeHtml|raw}</div>
        {else}
        <div class="doc-cat-empty">暂无公开分类</div>
        {/if}
    </nav>
    <div class="doc-panel-foot">
        <i class="ti ti-lock"></i>仅展示公开与加密分类
    </div>
</div>
