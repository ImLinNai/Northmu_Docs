<div class="nm-music-modal" id="nmMusicModal" aria-hidden="true">
    <div class="nm-music-backdrop" data-music-close></div>
    <div class="nm-music-dialog" role="dialog" aria-modal="true" aria-label="音乐歌单">
        <button type="button" class="nm-music-close" data-music-close aria-label="关闭歌单">
            <i class="ti ti-x"></i>
        </button>

        <section class="nm-music-player">
            <div class="nm-music-cover" id="musicCover">
                <img src="" alt="" hidden data-music-cover-img>
                <span class="nm-music-cover-fallback" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
                </span>
            </div>

            <div class="nm-music-meta">
                <h2 class="nm-music-title" data-music-title>音乐歌单</h2>
                <p class="nm-music-artist" data-music-artist></p>
            </div>

            <div class="nm-music-progress">
                <input type="range" class="nm-music-range" id="musicSeek" min="0" max="1000" step="1" value="0" aria-label="播放进度">
                <div class="nm-music-time">
                    <span data-music-elapsed>00:00</span>
                    <span data-music-total>00:00</span>
                </div>
            </div>

            <div class="nm-music-controls">
                <button type="button" class="nm-music-skip" data-music-prev aria-label="上一首">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5L8 12l10 7V5z" fill="currentColor" stroke="none"/><path d="M6 5v14"/></svg>
                </button>
                <button type="button" class="nm-music-play" data-music-toggle aria-label="播放">
                    <svg class="nm-music-icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M7 4.5c0-.9 1-1.4 1.7-.9l10.4 7.5c.6.4.6 1.4 0 1.8L8.7 20.4c-.7.5-1.7 0-1.7-.9V4.5z"/></svg>
                    <svg class="nm-music-icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
                </button>
                <button type="button" class="nm-music-skip" data-music-next aria-label="下一首">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l10 7-10 7V5z" fill="currentColor" stroke="none"/><path d="M18 5v14"/></svg>
                </button>
                <div class="nm-music-volume">
                    <button type="button" class="nm-music-mute" data-music-mute aria-label="静音">
                        <svg class="nm-music-icon-volume" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
                        <svg class="nm-music-icon-muted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
                    </button>
                    <input type="range" class="nm-music-range nm-music-volume-range" id="musicVolume" min="0" max="100" step="1" value="80" aria-label="音量">
                </div>
            </div>

            <div class="nm-music-lyrics" data-music-lyrics aria-live="polite">
                <p class="nm-music-lyrics-hint">暂无歌词，静静聆听。</p>
            </div>
        </section>

        <aside class="nm-music-playlist">
            <div class="nm-music-playlist-head">
                <span class="nm-music-playlist-title">播放列表</span>
                <span class="nm-music-playlist-count" data-music-count>0 首歌曲</span>
            </div>
            <ol class="nm-music-list" data-music-list></ol>
        </aside>

        <audio id="nmMusicAudio" preload="metadata"></audio>
        <script type="application/json" id="nmMusicData">{$musicJson|raw}</script>
    </div>
</div>
