<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0b1224">
    <title>维护中 - {$siteName}</title>
    <link rel="icon" href="{$faviconUrl}">
    <link rel="stylesheet" href="/static/vendor/tabler-icons/tabler-icons.min.css">
    <link rel="stylesheet" href="/static/css/maintenance.css">
</head>
<body class="nm-maint nm-maint-macos" data-maintenance-until="{$untilTs}">
<div class="macos-wallpaper" aria-hidden="true"></div>
<div class="macos-menubar">
    <span class="macos-menubar-brand"><i class="ti ti-book-2"></i><span>{$siteName}</span></span>
    <span class="macos-menubar-right"><span class="macos-clock" data-clock>--:--</span></span>
</div>
<main class="macos-stage">
    <section class="macos-window" role="status" aria-live="polite">
        <div class="macos-window-bar">
            <span class="macos-lights" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="macos-window-title">{$siteName}</span>
        </div>
        <div class="macos-window-body">
            <span class="macos-mark" aria-hidden="true"><i class="ti ti-tool"></i></span>
            <p class="macos-kicker">System Maintenance</p>
            <h1 class="macos-title">系统维护中</h1>
            <p class="macos-reason">{$reasonHtml|raw}</p>
            <div class="macos-meta">
                <div class="macos-meta-row"><span>当前状态</span><strong>维护中</strong></div>
                <div class="macos-meta-row"><span>预计恢复</span><strong>{if $untilTs}{$untilText}{else}时间待定{/if}</strong></div>
            </div>
            {if $untilTs}
            <div class="macos-countdown">剩余 <span data-countdown>--:--</span></div>
            {/if}
            <p class="macos-hint">维护期间仅管理员可访问，<a href="/admin/login">前往登录</a></p>
        </div>
    </section>
</main>
<script src="/static/js/maintenance.js" defer></script>
</body>
</html>
